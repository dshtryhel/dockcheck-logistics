name: DockCheck
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  DockCheck:
    type: application
    platform: iOS
    sources:
      - path: DockCheck
        excludes:
          - Frames
      - path: DockCheck/Frames
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dockcheck
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DockCheck
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
